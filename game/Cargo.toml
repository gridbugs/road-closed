[package]
name = "game"
version = "0.1.0"
authors = ["Stephen Sherratt <stephen@sherra.tt>"]
edition = "2021"

[dependencies]
coord_2d = { version = "0.4", features = ["serialize"] }
direction = { version = "0.19", features = ["serialize"] }
entity_table = { version = "0.2", features = ["serialize"] }
entity_table_realtime = { version = "0.2", features = ["serialize"] }
spatial_table = { version = "0.5", features = ["serialize"] }
grid_2d = { version = "0.16", features = ["serialize"] }
line_2d = { version = "0.6", features = ["serialize"] }
rgb_int = { version = "0.2", features = ["rand"] }
grid_search_cardinal = { version = "0.4", features = ["serialize"] }
shadowcast = { version = "0.9", features = ["serialize"] }
visible_area_detection = { version = "0.7", features = ["serialize"] }
log = "0.4"
serde = { version = "1", features = ["serde_derive"] }
rand = "0.9"
rand_isaac = { version = "0.4", features = ["serde"] }
vector = { path = "../util/vector" }
rational = { path = "../util/rational" }
rand_range = { path = "../util/rand-range" }
procgen = { path = "../procgen" }
